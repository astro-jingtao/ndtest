[build-system]
requires = [
    "meson-python>=0.17.1",
    "numpy>=2.0",
]
build-backend = "mesonpy"

[project]
name = "ndtest"
dynamic = ["version"]
description = "The collection of nonparametric test of the equality of high-dimensional probability distributions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tao Jing", email = "jingt20@mails.tsinghua.edu.cn" }]
keywords = [
    "Kolmogorov-Smirnov",
    "two-sample test",
    "nonparametric statistics",
    "astronomy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.10",
    "joblib>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/astro-jingtao/ndtest"

[tool.pytest.ini_options]
testpaths = ["tests"]
