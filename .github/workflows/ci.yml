name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned ruff
        run: python -m pip install ruff==0.17.4
      - name: Check the formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # setup-python ships no 3.9 for ubuntu-latest (26.04); the 3.9
          # floor runs on the 24.04 image, where the interpreter exists
          - os: ubuntu-latest
            python-version: "3.9"
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Only the macOS image ships no Fortran compiler; the Linux images carry
      # gfortran and the Windows image a MinGW-w64 toolchain in C:\mingw64\bin.
      - name: Install a Fortran compiler (macOS)
        if: runner.os == 'macOS'
        run: command -v gfortran || brew install gfortran
      - name: Install the package with its test dependencies
        # The latest pip builds in an isolated environment, which is the
        # installation path of a user; the build fetches numpy, meson-python
        # and ninja itself.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Test the installed package
        # `pytest` and not `python -m pytest`: the latter puts the checkout
        # first on sys.path, where the package has no compiled extension.
        run: pytest
      - name: Show the DLL dependencies of the extension (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          where.exe gfortran
          $site = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $pyd = Get-ChildItem "$site\ndtest\maxdist*.pyd"
          $pyd.FullName
          objdump -p $pyd.FullName | Select-String "DLL Name"
          ($env:PATH -split ';') | Where-Object { $_ -match 'mingw|msys' }

  sdist:
    name: sdist, wheel from sdist, install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the source distribution and a wheel from it
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Install the wheel and test it
        run: |
          python -m pip install dist/*.whl pytest
          pytest
